<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Method</title>
</head>
<body>
    <h1>Array Method</h1>
    <hr>
    <script>

        let arr = [1, 2, 5, 3, 4 ,5 , 6, 7]

        console.log(arr);
        console.log(arr[2]);
        console.log(arr[3]);
        console.log(arr.length);
        console.log(arr.indexOf(5));
        console.log(arr.lastIndexOf(5));
        console.log(arr);
        console.log(arr.push(50));
        console.log(arr);
        console.log(arr);
        console.log(arr.pop());
        console.log(arr);
        console.log(arr.shift());
        console.log(arr);
        console.log(arr.unshift(100));
        console.log(arr);
        // console.log(arr.reverse());
        // console.log(arr.splice(2,2));
        console.log(arr.slice(2,46));
        console.log(arr);   
        
        
    </script>
</body>
</html>
