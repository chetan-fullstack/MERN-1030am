<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conditional Statement</title>
  </head>
  <body>
    <h1>Conditional Statement</h1>
    <script>
      // Conditional Statement

      // 1. if...

      let a = 1;

      if (a == 10) {
        console.log("a is Equal to 10");
      }

      // 2. if...else

      if (a == 10) {
        console.log("a is Equal to 10");
      } else {
        console.log("a is Not Equal to 10");
      }
      // 3. if...else if ....else

      let age = 18;

      if (age > 18) {
        console.log("You Can Drive");
      } else if (age < 18) {
        console.log("You Can't Drive");
      } else {
        console.log("Bro, Wait!");
      }

      // 4. switch case


      let num = 3

      switch (num) {
        case 1:
          console.log("One");
          
          break;
        case 2:
          console.log("Two");
          
          break;
        case 3:
          console.log("Three");
          
          break;
        case 4:
          console.log("Four");
          
          break;
          
          default:
          console.log("Choose a Valid Number From 1 to 4");
          break;
      }
    </script>
  </body>
</html>
